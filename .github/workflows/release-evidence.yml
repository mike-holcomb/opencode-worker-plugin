name: Release evidence
on:
  push:
    branches: ['feat/opencode-agents-v2', 'release-evidence/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  environment:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: ['24.15.0', '24.21.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/opencode-agents/runtime/package-lock.json
      - run: npm ci
        working-directory: plugins/opencode-agents/runtime
      - run: node plugins/opencode-agents/runtime/scripts/release/platform.mjs --out "${{ runner.temp }}/release-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: error
